    <filter id="sh" x="0" y="0" width="1" height="1"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#29253A" flood-opacity=".09"/></filter>
    <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2F2F3A}.m{fill:#777787}.label{font-size:14px;font-weight:700;letter-spacing:1.3px}.title{font-size:27px;font-weight:700}.small{font-size:15px}</style>
