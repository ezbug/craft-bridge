  <rect x="281" y="241" width="42" height="33" rx="9" fill="#7C3AED"/><text x="302" y="263" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">⌘⌥O</text><text x="331" y="257" class="t" font-size="16" font-weight="700">打开搜索</text><text x="281" y="290" class="t small m">快捷键或菜单栏</text>
